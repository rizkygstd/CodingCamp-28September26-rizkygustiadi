<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Theme harness</title>
<!-- Reuse the REAL app stylesheet so computed styles reflect production CSS. -->
<link rel="stylesheet" href="../../css/styles.css">
</head>
<body>
<!-- Minimal subset of the real app DOM the ThemeManager / ChartComponent touch. -->
<header id="balance-section">
  <h1>Total Spending</h1>
  <div id="balance-amount" aria-live="polite">$0.00</div>
  <button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
    <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<pre id="results">running...</pre>

<script>
// Pull just the ThemeManager out of the real app.js by evaluating the file,
// but app.js references many DOM nodes in initApp via DOMContentLoaded. To keep
// this harness focused and deterministic we re-declare a module-scoped uiManager
// stub (null) so ThemeManager.refreshChart() no-ops, then load app.js.
window.__results = [];
function log(msg){ window.__results.push(msg); }
</script>
<!-- Load the real application code. initApp will run; it uses real localStorage.
     We clear the theme key first via the inline script above is too late, so do it here. -->
<script>
try { localStorage.removeItem('expense-tracker-theme'); } catch(e){}
</script>
<script src="../../js/app.js"></script>
<script>
(function(){
 try {
  if (typeof ThemeManager === 'undefined') {
    document.getElementById('results').textContent = 'ERROR: ThemeManager undefined';
    return;
  }
  const root = document.documentElement;
  const toggle = document.getElementById('theme-toggle');
  const icon = toggle.querySelector('.theme-toggle-icon');
  function cs(prop){ return getComputedStyle(root).getPropertyValue(prop).trim(); }
  function snapshot(tag){
    log(tag +
        ' | data-theme=' + (root.getAttribute('data-theme') || '(none)') +
        ' | aria-pressed=' + toggle.getAttribute('aria-pressed') +
        ' | icon=' + icon.textContent +
        ' | --color-background=' + cs('--color-background') +
        ' | --color-text=' + cs('--color-text') +
        ' | --color-border=' + cs('--color-border'));
  }

  // 1. State right after init (no stored pref -> OS preference drives it).
  snapshot('AFTER_INIT (no stored pref -> OS)');
  log('OS prefers dark = ' + window.matchMedia('(prefers-color-scheme: dark)').matches);

  // 2. Explicitly apply dark and light to prove the tokens flip.
  ThemeManager.applyTheme('dark');
  snapshot('APPLY_DARK');
  ThemeManager.applyTheme('light');
  snapshot('APPLY_LIGHT');

  // 3. Toggle via the real handler path and confirm persistence.
  ThemeManager.applyTheme('light');
  ThemeManager.saveTheme('light');
  toggle.click();            // -> dark, persisted
  snapshot('AFTER_CLICK_1');
  log('stored after click1 = ' + localStorage.getItem('expense-tracker-theme'));
  toggle.click();            // -> light, persisted
  snapshot('AFTER_CLICK_2');
  log('stored after click2 = ' + localStorage.getItem('expense-tracker-theme'));

  // 4. Simulate reload-with-stored-dark: set storage, re-run getPreferredTheme.
  localStorage.setItem('expense-tracker-theme', 'dark');
  log('getPreferredTheme() with stored dark = ' + ThemeManager.getPreferredTheme());
  localStorage.setItem('expense-tracker-theme', 'light');
  log('getPreferredTheme() with stored light = ' + ThemeManager.getPreferredTheme());

  document.getElementById('results').textContent = window.__results.join('\n');
 } catch (e) {
  document.getElementById('results').textContent = 'EXCEPTION: ' + (e && e.stack ? e.stack : e);
 }
})();
</script>
</body>
</html>
