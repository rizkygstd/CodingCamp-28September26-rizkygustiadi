<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<title>Theme harness</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header id="balance-section">
  <h1>Total Spending</h1>
  <div id="balance-amount" aria-live="polite">$0.00</div>
  <button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
    <span class="theme-toggle-icon" aria-hidden="true">M</span>
  </button>
</header>
<pre id="results">ERROR: ThemeManager undefined</pre>

<script>try { localStorage.removeItem('expense-tracker-theme'); } catch(e){}</script>
<script src="js/app.js"></script>
<script>
window.addEventListener('load', function(){
 var out = [];
 function log(m){ out.push(m); }
 try {
  if (typeof ThemeManager === 'undefined') {
    document.getElementById('results').textContent = 'ERROR: ThemeManager undefined';
    return;
  }
  var root = document.documentElement;
  var toggle = document.getElementById('theme-toggle');
  var icon = toggle.querySelector('.theme-toggle-icon');
  function cs(p){ return getComputedStyle(root).getPropertyValue(p).trim(); }
  function snap(tag){
    log(tag +
      ' | data-theme=' + (root.getAttribute('data-theme') || '(none)') +
      ' | aria-pressed=' + toggle.getAttribute('aria-pressed') +
      ' | icon=' + icon.textContent +
      ' | bg=' + cs('--color-background') +
      ' | text=' + cs('--color-text') +
      ' | border=' + cs('--color-border') +
      ' | food=' + cs('--color-food'));
  }

  snap('AFTER_INIT');
  log('OS_prefers_dark=' + window.matchMedia('(prefers-color-scheme: dark)').matches);

  ThemeManager.applyTheme('dark');  snap('APPLY_DARK');
  ThemeManager.applyTheme('light'); snap('APPLY_LIGHT');

  ThemeManager.applyTheme('light'); ThemeManager.saveTheme('light');
  toggle.click(); snap('AFTER_CLICK_1');
  log('stored_after_click1=' + localStorage.getItem('expense-tracker-theme'));
  toggle.click(); snap('AFTER_CLICK_2');
  log('stored_after_click2=' + localStorage.getItem('expense-tracker-theme'));

  localStorage.setItem('expense-tracker-theme','dark');
  log('getPreferredTheme_storedDark=' + ThemeManager.getPreferredTheme());
  localStorage.setItem('expense-tracker-theme','light');
  log('getPreferredTheme_storedLight=' + ThemeManager.getPreferredTheme());

  document.getElementById('results').textContent = out.join('\n');
 } catch (e) {
  document.getElementById('results').textContent = 'EXCEPTION: ' + (e && e.stack ? e.stack : e);
 }
});
</script>


</body></html>
