<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>toggle verify</title>
</head>
<body>
<!-- Mirror the real app's theme toggle + minimal structure app.js touches -->
<header id="balance-section">
  <div id="balance-amount" aria-live="polite">$0.00</div>
  <button id="theme-toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false">
    <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
  </button>
</header>
<main>
  <form id="transaction-form" aria-label="Add transaction">
    <input type="text" id="item-name" />
    <span class="error-message" id="item-name-error" role="alert"></span>
    <input type="number" id="amount" />
    <span class="error-message" id="amount-error" role="alert"></span>
    <select id="category"><option value="">x</option><option value="Food">Food</option></select>
    <span class="error-message" id="category-error" role="alert"></span>
    <button type="submit" class="btn-primary">Add</button>
  </form>
  <div id="transactions-container"><p id="empty-state" class="empty-state">none</p></div>
  <canvas id="expense-chart" role="img" aria-label="chart"></canvas>
  <div id="chart-empty-state">x</div>
  <div id="monthly-summary-container"><p id="monthly-summary-empty-state" class="empty-state">none</p></div>
</main>
<div id="global-error" class="is-hidden" role="alert"><span id="error-message"></span><button aria-label="Dismiss error">x</button></div>
<div id="log"></div>
<script>
  // Capture any uncaught error so we can read it from the dumped DOM.
  window.__errs = [];
  window.addEventListener('error', function (e) {
    window.__errs.push('ONERROR: ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '') + (e.error && e.error.stack ? '\nSTACK: ' + e.error.stack : ''));
  });
  // Real Chart.js is a CDN script; emulate "no Chart" when offline by leaving it undefined
  // only if the CDN fails. For this harness we stub a functional Chart.
  window.Chart = function (ctx, config) {
    this.data = config.data;
    this.options = config.options;
    this.update = function () {};
    this.destroy = function () {};
  };
</script>
<script src="js/app.js"></script>
<script>
  // Give initApp (DOMContentLoaded / readyState) a tick, then exercise toggle.
  setTimeout(function () {
    const log = document.getElementById('log');
    const lines = [];
    try {
      lines.push('uiManager set: ' + (typeof uiManager !== 'undefined' && uiManager !== null));
      lines.push('theme before: ' + ThemeManager.getCurrentTheme());
      // Click toggle: light -> dark
      document.getElementById('theme-toggle').click();
      lines.push('theme after 1st click: ' + ThemeManager.getCurrentTheme());
      // Click toggle: dark -> light
      document.getElementById('theme-toggle').click();
      lines.push('theme after 2nd click: ' + ThemeManager.getCurrentTheme());
    } catch (ex) {
      lines.push('SYNC_THROW: ' + ex.message + '\n' + ex.stack);
    }
    const banner = document.getElementById('global-error');
    lines.push('banner hidden after toggles: ' + banner.classList.contains('is-hidden'));
    lines.push('banner text: "' + document.getElementById('error-message').textContent + '"');
    lines.push('captured errors count: ' + window.__errs.length);
    window.__errs.forEach(e => lines.push(e));
    log.textContent = 'TOGGLE_RESULT\n' + lines.join('\n');
  }, 300);
</script>
</body>
</html>
